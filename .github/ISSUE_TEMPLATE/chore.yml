name: Chore
description: Tooling, infrastructure, config, or dependency work
title: "[CHORE] "
labels: ["type:chore", "status:needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - build / bundler
        - lint / format
        - typecheck
        - test runner
        - CI
        - dependency upgrade
        - tooling script
        - editor / dev env
        - docs tooling
        - other
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - Low — no behaviour change
        - Medium — touches build pipeline or shared config
        - High — touches CI gates or release plumbing
    validations:
      required: true
