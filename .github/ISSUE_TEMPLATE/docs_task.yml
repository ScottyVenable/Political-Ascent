name: Docs / research task
description: Documentation, Wiki, or research work.
title: "docs: <short summary>"
labels: ["type:docs", "status:triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs writing / updating?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now?
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target location
      description: Path under `docs/` or Wiki page name.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References / sources
