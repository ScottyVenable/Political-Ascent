name: Feature request
description: A design-motivated new feature or improvement.
title: "feat: <short summary>"
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why are we building this? What player experience does it enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What is the shape of the feature? Systems touched, data needed, UI implications.
    validations:
      required: true
  - type: input
    id: gdd
    attributes:
      label: GDD / Roadmap reference
      description: Which section of `docs/GDD.md` or `docs/ROADMAP.md` does this implement or extend?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bulleted list of what "done" means. Include test and screenshot expectations.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks / open questions
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - engine
        - legislation
        - congress
        - population
        - economy
        - cards
        - quests
        - skills
        - ui
        - character
        - dialogue
        - save
        - settings
        - android
        - docs
        - ci
        - other
    validations:
      required: true
