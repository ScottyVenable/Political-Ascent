name: Android APK pre-release

# Manually-triggered build of a debug Android APK.
#
# Triggered from the Actions tab → "Android APK pre-release" → "Run workflow".
# The workflow runs against whichever branch is selected in the Run-workflow
# dialog, builds the web bundle, syncs it into the Capacitor Android project,
# assembles a debug APK, and publishes it as a **pre-release** on GitHub
# tagged with the package.json version and the build timestamp.
#
# Tag format: `apk-v<version>-<YYYYMMDD-HHMM>` (UTC).
# Release name: `APK v<version> — <YYYY-MM-DD HH:MM UTC>`.
#
# This is intentionally a *debug* APK — release-signed APKs require a keystore
# and credentials we do not yet store as repository secrets. See
# `docs/ROADMAP.md` v0.1.1 for the signed-release follow-up.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes to include in the pre-release body."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build & publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compute version and timestamp
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # UTC timestamp; minute precision is enough for tag uniqueness.
          STAMP=$(date -u +'%Y%m%d-%H%M')
          PRETTY=$(date -u +'%Y-%m-%d %H:%M UTC')
          TAG="apk-v${VERSION}-${STAMP}"
          NAME="APK v${VERSION} — ${PRETTY}"
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="political-ascent-v${VERSION}-${STAMP}-debug.apk"
          {
            echo "version=${VERSION}"
            echo "stamp=${STAMP}"
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "branch=${BRANCH}"
            echo "short_sha=${SHORT_SHA}"
            echo "apk_name=${APK_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Build web bundle
        run: npm run build:web

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK with version + timestamp
        id: rename
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="android/app/build/outputs/apk/debug/${{ steps.meta.outputs.apk_name }}"
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected APK not found at $SRC"
            ls -la android/app/build/outputs/apk/debug/ || true
            exit 1
          fi
          cp "$SRC" "$DEST"
          echo "apk_path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: ${{ steps.rename.outputs.apk_path }}
          body: |
            **Political Ascent — Android debug APK**

            - Version: `${{ steps.meta.outputs.version }}`
            - Branch: `${{ steps.meta.outputs.branch }}`
            - Commit: `${{ steps.meta.outputs.short_sha }}`
            - Built: `${{ steps.meta.outputs.stamp }}` (UTC)
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            > This is an **unsigned debug build**. Install at your own risk; not
            > intended for general distribution. Release-signed APKs are a
            > follow-up roadmap item (`docs/ROADMAP.md` v0.1.1).

            ${{ inputs.release_notes }}
