name: Android APK Pre-release

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - experimental

permissions:
  contents: write

concurrency:
  group: apk-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build debug APK and publish pre-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate release metadata
        id: metadata
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="apk-preview-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Android APK Preview #${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
