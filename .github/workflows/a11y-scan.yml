# a11y-scan.yml
# Per docs/GDD.md §13.4. Runs the existing accessibility.spec.ts and, if
# @axe-core/playwright is installed, an axe-driven scan with severity gates.
# Allowlist: .github/a11y-allowlist.json.

name: a11y-scan

on:
  pull_request:
    paths:
      - 'src/renderer/**'
      - 'tests/e2e/**'
      - 'index.html'
      - '.github/workflows/a11y-scan.yml'
      - '.github/a11y-allowlist.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: a11y-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install browser deps when cached
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run existing accessibility spec
        run: npx playwright test --project=chromium-1280x720 tests/e2e/accessibility.spec.ts

      - name: Detect @axe-core/playwright availability
        id: axe-detect
        shell: bash
        run: |
          if node -e "require.resolve('@axe-core/playwright')" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice — axe dep not installed
        if: steps.axe-detect.outputs.present == 'false'
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        with:
          header: a11y-axe-skip
          message: |
            ### a11y-scan: axe-driven scan skipped
            `@axe-core/playwright` is not yet in `devDependencies`.
            The existing `tests/e2e/accessibility.spec.ts` ran; the dedicated axe scan
            (per GDD §13.4.2 severity gates) is deferred until the dep is added.
            Tracking: Sol Phase-4 follow-up.

      - name: Run axe scan (when available)
        if: steps.axe-detect.outputs.present == 'true'
        env:
          A11Y_ALLOWLIST: .github/a11y-allowlist.json
        # The axe spec is expected at tests/e2e/axe.spec.ts. Until that lands,
        # this step warns and passes — a placeholder for the M-now → M6 ramp.
        shell: bash
        run: |
          if [ -f tests/e2e/axe.spec.ts ]; then
            npx playwright test --project=chromium-desktop tests/e2e/axe.spec.ts
          else
            echo "::warning::@axe-core/playwright is installed but tests/e2e/axe.spec.ts not present yet."
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
